services:
  - type: web
    name: laravel-task-api
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Taskflow Pro"
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: "https://laravel-task-api.onrender.com"
      - key: LOG_CHANNEL
        value: stderr

      # ==== SESIÓN / CACHÉ / COLAS ====
      # Las tablas correspondientes las crean las migraciones.
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # ==== CONEXIÓN A BASE DE DATOS (NEON) ====
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      # Requerida: se completa en el Dashboard de Render al crear el servicio
      # con el connection string de Neon, ej:
      # postgres://usuario:password@ep-xxx.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false

      # ==== VARIABLES PARA EL FRONTEND EN VERCEL ====
      # Requeridas: se completan en el Dashboard de Render.
      - key: FRONTEND_URL
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: SESSION_DOMAIN
        value: ".onrender.com"
